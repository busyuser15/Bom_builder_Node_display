<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOM Builder - CK International</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>📋 BOM Builder</h1>
        <p>Manage and edit your Bill of Materials with hierarchical tree view, search, and real-time changes.</p>
        <p id="status">Backend status: <span id="backend-status" style="background: #fed7d7; color: #742a2a;">offline</span></p>
        
        <form id="upload-form">
          <label for="bom-file">📁 Select BOM Excel file</label>
          <input id="bom-file" name="file" type="file" accept=".xlsx,.xlsm" required />
          <button type="submit">⬆️ Upload and Parse</button>
        </form>
      </section>

      <section class="panel">
        <h2>BOM Hierarchy</h2>
        <div class="controls">
          <div class="search-controls">
            <label for="search-type" style="margin: 0;">Search by:</label>
            <select id="search-type">
              <option value="part">🔍 Part Number</option>
              <option value="description">📝 Description</option>
            </select>
            <input type="text" id="search-input" placeholder="Type to search..." />
            <button id="search-btn">🔎 Find</button>
            <button id="reset-search-btn">↺ Reset</button>
          </div>
          <div class="tree-controls">
            <button id="expand-all-btn">⬇️ Expand All</button>
            <button id="collapse-all-btn">⬆️ Collapse All</button>
          </div>
        </div>
        <div id="tree-container"></div>
      </section>

      <section class="panel">
        <h2>✏️ Part Details</h2>
        <div id="part-details">Select a part from the tree to view and edit details</div>
      </section>

      <section class="panel" id="actions-section">
        <h2>📤 Actions</h2>
        <div id="action-buttons" style="display: flex; gap: 1rem; flex-wrap: wrap;"></div>
      </section>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>⚙️ Settings</h2>
          <button class="modal-close" onclick="closeSettings()">&times;</button>
        </div>
        <div class="modal-body">
          <p>Settings coming soon!</p>
        </div>
        <div class="modal-footer">
          <button class="modal-btn-close" onclick="closeSettings()">Close</button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
